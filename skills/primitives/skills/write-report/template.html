<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            // The colours of the CMYK dark theme for Zed.
            colors: { ink: "#0a0a0f", slab: "#17111f", paper: "#e8e0f0", muted: "#b0a8c0", line: "#352240", hover: "#251830", mag: "#ff2e97" },
            fontFamily: { sans: ["Archivo", "sans-serif"], mono: ['"JetBrains Mono"', "monospace"] },
            boxShadow: { hard: "6px 6px 0 #ff2e97", "hard-paper": "5px 5px 0 #e8e0f0" },
          },
        },
      };
    </script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
      await mermaid.run({ querySelector: ".mermaid" });
    </script>
    <style>
      .cell { white-space: pre-wrap; }
      .display { font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; }
      input[type="checkbox"] { accent-color: #ff2e97; width: 1rem; height: 1rem; }
      ::selection { background: #ff2e97; color: #0a0a0f; }
    </style>
  </head>
  <body class="bg-ink text-paper font-sans">
    <main class="px-6 pt-8 space-y-12">
      <header id="report-head" class="space-y-4 border-b-4 border-paper pb-6"></header>
      <details id="other-reports" hidden class="text-sm">
        <summary class="cursor-pointer font-mono text-xs uppercase tracking-widest text-mag"></summary>
        <ul class="mt-3 space-y-1 font-mono text-xs"></ul>
      </details>
      <div id="report-runs" class="space-y-20"></div>
      <section id="prompt-box" hidden class="sticky bottom-0 bg-ink border-t-4 border-mag pt-4 pb-5">
        <textarea id="prompt" readonly class="w-full h-36 font-mono text-sm p-3 border-2 border-paper bg-slab text-paper focus:outline-none focus:border-mag"></textarea>
        <div class="flex items-center gap-4 mt-3">
          <button id="copy" type="button" class="display text-sm px-5 py-2 bg-mag text-ink shadow-hard-paper active:translate-x-1 active:translate-y-1 active:shadow-none">Copy prompt</button>
          <span id="copied" class="font-mono text-xs uppercase tracking-widest text-mag"></span>
        </div>
      </section>
    </main>

    <script type="application/json" id="runs">
{"title": "Report", "path": "", "skill": "", "runs": []}
    </script>

    <!-- reports.js lists the reports in this folder. Each write of a report writes it again. -->
    <script src="reports.js"></script>
    <script>
      // The page builds itself from the runs block. Change the data, not this script.
      const data = JSON.parse(document.getElementById("runs").textContent);
      const tickCount = new Map();

      const make = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const table = (labels, bodyRows) => {
        const t = make("table", "w-full text-sm bg-slab border-2 border-paper");
        const headRow = t.appendChild(make("thead")).appendChild(make("tr", "bg-paper text-ink text-left"));
        for (const label of labels) {
          headRow.append(make("th", "display px-3 py-2 text-xs", label));
        }
        const body = t.appendChild(make("tbody"));
        for (const cells of bodyRows) {
          const tr = body.appendChild(make("tr", "border-t border-line hover:bg-hover"));
          tr.append(...cells);
        }
        return t;
      };

      const td = (child, cls = "") => {
        const cell = make("td", `px-3 py-2 align-top ${cls}`);
        if (child) cell.append(child);
        return cell;
      };

      const visual = (v) => {
        const fig = make(v.fold ? "details" : "figure", "space-y-2");
        fig.append(make(v.fold ? "summary" : "figcaption", `font-mono text-xs uppercase tracking-widest text-mag${v.fold ? " cursor-pointer" : ""}`, v.question));
        if (v.mermaid) {
          fig.append(make("pre", "mermaid border-2 border-paper bg-slab p-4", v.mermaid));
        }
        if (v.bars) {
          const max = Math.max(1, ...v.bars.map(([, count]) => count));
          const list = fig.appendChild(make("div", "space-y-1 border-2 border-paper bg-slab p-4"));
          for (const [label, count] of v.bars) {
            const line = list.appendChild(make("div", "grid grid-cols-[14rem_1fr] items-center gap-3 text-sm"));
            line.append(make("span", "truncate", label));
            const bar = line.appendChild(make("span", "block h-5 bg-mag px-2 font-mono text-xs font-bold leading-5 text-ink", String(count)));
            bar.style.width = `max(2rem, ${(count / max) * 100}%)`;
          }
        }
        if (v.table) {
          fig.append(table(v.table.columns, v.table.rows.map((row) => row.map((text) => td(make("div", "cell", text))))));
        }
        if (v.html) {
          const box = fig.appendChild(make("div"));
          box.innerHTML = v.html;
        }
        return fig;
      };

      const rowCell = (col, text) => {
        if (col.fold && text) {
          const fold = make("details");
          fold.append(make("summary", "cursor-pointer font-mono text-xs uppercase tracking-widest text-mag", "Open"), make("div", "cell mt-1", text));
          return td(fold);
        }
        return td(make("div", col.mono ? "cell font-mono text-xs" : "cell", text));
      };

      // A tick named in data.track only marks the row. It adds nothing to the prompt.
      const track = new Set(data.track || []);
      const tickCells = (row) => {
        const ticks = row.ticks || [];
        tickCount.set(row.id, ticks.filter((kind) => !track.has(kind)).length);
        const boxes = make("div", "space-y-1");
        for (const kind of ticks) {
          const label = boxes.appendChild(make("label", "flex items-center gap-2 font-mono text-xs uppercase tracking-wider"));
          const box = make("input");
          box.type = "checkbox";
          box.dataset.id = row.id;
          if (track.has(kind)) box.dataset.track = kind;
          else box.dataset.tick = kind;
          label.append(box, kind);
        }
        let note = null;
        if (ticks.length) {
          note = make("input", "w-full min-w-[10rem] border border-muted bg-ink px-2 py-1 text-xs text-paper placeholder:text-muted focus:outline-none focus:border-mag");
          note.type = "text";
          note.placeholder = "Note";
          note.dataset.note = row.id;
        }
        return [td(boxes, "whitespace-nowrap"), td(note)];
      };

      const rowsTable = (run) => {
        const withTicks = Boolean(data.skill) && run.rows.some((row) => (row.ticks || []).length);
        const labels = ["ID", ...run.columns.map((col) => col.label), ...(withTicks ? ["Tick", "Note"] : [])];
        return table(labels, run.rows.map((row) => [
          td(make("span", "font-mono text-xs text-mag", row.id)),
          ...run.columns.map((col) => rowCell(col, row.cells[col.key] ?? "")),
          ...(withTicks ? tickCells(row) : []),
        ]));
      };

      document.title = data.title;
      const head = document.getElementById("report-head");
      head.append(make("h1", "display text-5xl leading-none", data.title), make("p", "inline-block border-2 border-mag px-3 py-1 font-mono text-xs tracking-wider text-mag", data.path));

      const here = decodeURIComponent(location.pathname.split("/").pop());
      const others = (window.REPORTS || []).filter((name) => name !== here);
      if (others.length) {
        const fold = document.getElementById("other-reports");
        fold.hidden = false;
        fold.querySelector("summary").textContent = `Other reports in this folder (${others.length})`;
        const list = fold.querySelector("ul");
        for (const name of others) {
          const link = list.appendChild(make("li")).appendChild(make("a", "text-paper underline decoration-mag decoration-2 underline-offset-4 hover:text-mag", name));
          link.href = encodeURIComponent(name);
        }
      }

      const view = document.getElementById("report-runs");
      for (const run of data.runs) {
        const section = view.appendChild(make("section", "space-y-6"));
        const title = make("h2", "display text-3xl leading-none");
        title.append(make("span", "text-mag", `Run ${run.run}: `), run.title);
        section.append(title, make("p", "font-mono text-xs uppercase tracking-widest text-muted", `${run.head || "no commit"} · ${run.date}`));
        const meta = Object.entries(run.meta || {}).map(([label, value]) => `${label}: ${value}`).join(" · ");
        if (meta) section.append(make("p", "font-mono text-xs text-muted", meta));
        section.append(make("p", "border-2 border-paper bg-slab px-5 py-4 text-lg leading-relaxed shadow-hard", run.answer));
        for (const v of run.visuals || []) section.append(visual(v));
        if ((run.rows || []).length) section.append(rowsTable(run));
      }

      const promptBox = document.getElementById("prompt");
      const buildPrompt = () => {
        const picked = new Map();
        for (const box of document.querySelectorAll("input[data-tick]:checked")) {
          picked.set(box.dataset.id, [...(picked.get(box.dataset.id) || []), box.dataset.tick]);
        }
        if (!picked.size) {
          promptBox.value = "Tick a row to build the prompt.";
          return;
        }
        const ids = [...picked].map(([id, kinds]) => (tickCount.get(id) > 1 ? `${id}:${kinds.join("+")}` : id));
        const notes = [...picked.keys()]
          .map((id) => [id, document.querySelector(`input[data-note="${id}"]`).value.trim()])
          .filter(([, note]) => note);
        const lines = [`${data.skill} @${data.path} ${ids.join(" ")}`];
        if (notes.length) lines.push("Notes:", ...notes.map(([id, note]) => `- ${id}: ${note}`));
        promptBox.value = lines.join("\n");
      };

      if (data.skill && tickCount.size) {
        document.getElementById("prompt-box").hidden = false;
        document.addEventListener("change", buildPrompt);
        document.addEventListener("input", buildPrompt);
        document.getElementById("copy").onclick = async () => {
          try {
            await navigator.clipboard.writeText(promptBox.value);
          } catch {
            promptBox.select();
            document.execCommand("copy");
          }
          const copied = document.getElementById("copied");
          copied.textContent = "Copied.";
          setTimeout(() => (copied.textContent = ""), 2000);
        };
        buildPrompt();
      }
    </script>
  </body>
</html>
