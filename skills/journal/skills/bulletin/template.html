<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulletin · {{year}} week {{week}}</title>
<style>
  :root {
    --accent: #8a2b1d;
    --paper: #fbf8f1;
    --ink: #121212;
    --muted: #6f6a60;
    --rule: #ddd6c8;
    --code: #f0ebe0;
    --heading: "Noto Serif", Georgia, serif;
    --body: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --mono: "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.65 var(--body); }
  .sheet { max-width: 1080px; margin: 0 auto; padding: 40px 32px 80px; }
  a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  code { font: 0.82em/1.3 var(--mono); background: var(--code); padding: 1px 4px; }
  h1, h2, h3 { font-family: var(--heading); font-weight: 700; margin: 0 0 8px; line-height: 1.15; }
  h3 { font: 700 0.78rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); border-top: 2px solid var(--accent); padding-top: 12px; margin: 28px 0 14px; }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 8px; }
  li::marker { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font: 0.85rem/1.4 var(--body); margin-bottom: 16px; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  th { color: var(--muted); font: 500 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .page-title { font: 700 0.78rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); border-bottom: 3px double var(--accent); padding-bottom: 10px; margin-bottom: 28px; }
  .entry { margin-bottom: 56px; padding-bottom: 32px; border-bottom: 1px solid var(--ink); }
  .masthead { border-top: 1px solid var(--ink); border-bottom: 3px double var(--accent); padding: 12px 0; margin-bottom: 20px; }
  .masthead h2 { font-size: 2em; margin: 0; }
  .masthead .dateline { font: 500 0.72rem/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .standfirst { font: italic 1.1em/1.45 var(--heading); color: var(--muted); padding-left: 14px; border-left: 3px solid var(--accent); }
  .tag { display: inline-block; font: 700 0.68rem/1.6 var(--mono); color: var(--paper); background: var(--accent); padding: 0 5px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 6px; }
  .tag.unchanged { background: var(--muted); }
  .muted { color: var(--muted); }
  .forecast { font: 700 1.2em/1.3 var(--heading); margin-bottom: 4px; }
  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0 32px; align-items: start; }
  .main, .side { min-width: 0; }
  .side { border-left: 1px solid var(--rule); padding-left: 24px; }
  .masonry { columns: 2 220px; column-gap: 20px; }
  .card { break-inside: avoid; border: 1px solid var(--rule); border-top: 3px solid var(--accent); background: var(--code); padding: 12px 14px 4px; margin: 0 0 20px; }
  .card h4 { font: 700 0.72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 0 0 8px; }
  figure { margin: 0 0 16px; }
  figcaption { font: 0.78rem/1.4 var(--body); color: var(--muted); margin-top: 4px; }
  .chart { display: block; width: 100%; height: auto; max-width: 480px; }
  .chart .fill-accent { fill: var(--accent); }
  .chart .fill-muted { fill: var(--muted); }
  .chart .axis { stroke: var(--ink); stroke-width: 1; fill: none; }
  .chart .label { fill: var(--ink); font: 12px var(--mono); }
  @media (max-width: 700px) {
    .sheet { padding: 24px 16px 48px; }
    .layout { grid-template-columns: 1fr; }
    .side { border-left: 0; padding-left: 0; }
    .masonry { columns: 1; }
  }
</style>
</head>
<body>
<div class="sheet">
<h1 class="page-title">Bulletin · {{year}} week {{week}}</h1>
<main id="entries">
</main>
</div>
</body>
</html>
