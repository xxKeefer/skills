    <!-- reports.js lists the reports in this folder. Each write of a report writes it again. -->
    <script src="reports.js"></script>
    <script>
      // The page builds itself from the runs block. Change the data, not this script.
      const data = JSON.parse(document.getElementById("runs").textContent);
      const tickCount = new Map();

      const make = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const table = (labels, bodyRows) => {
        const t = make("table", "w-full border-collapse text-sm");
        const headRow = t.appendChild(make("thead")).appendChild(make("tr", "text-left"));
        for (const label of labels) headRow.append(make("th", "kicker border-b border-ink py-2 pr-3 text-muted", label));
        const body = t.appendChild(make("tbody"));
        for (const cells of bodyRows) {
          const tr = body.appendChild(make("tr", "border-b border-rule"));
          for (const text of cells) tr.append(make("td", "cell py-2 pr-3 align-top", text));
        }
        return t;
      };

      const toneWords = {
        danger: ["blocker", "critical", "change requested", "bug", "fail", "failed", "broken", "high", "valid", "not done", "review miss"],
        warning: ["major", "medium", "partially valid", "warn", "warning", "risk", "skill gap"],
        info: ["nit", "minor", "low", "info", "future", "question", "suggestion", "unknown"],
        success: ["pass", "passed", "ok", "done", "fixed", "applied", "resolved", "replied", "clear", "invalid"],
      };
      const tone = (text) => {
        const word = String(text ?? "").toLowerCase().split(",")[0].trim();
        return Object.keys(toneWords).find((name) => toneWords[name].includes(word));
      };

      const visual = (v) => {
        const wide = Boolean(v.mermaid || v.html);
        const fig = make(v.fold ? "details" : "figure", `border-t-2 border-accent pt-3 ${wide ? "md:col-span-2" : ""}`);
        fig.append(make(v.fold ? "summary" : "figcaption", `kicker mb-4 text-accent${v.fold ? " cursor-pointer" : ""}`, v.question));
        if (v.mermaid) fig.append(make("pre", "mermaid bg-paper", v.mermaid));
        if (v.bars) {
          const max = Math.max(1, ...v.bars.map(([, count]) => count));
          const list = fig.appendChild(make("div", "space-y-2"));
          for (const [label, count] of v.bars) {
            const line = list.appendChild(make("div", "grid grid-cols-[10rem_1fr] items-center gap-3 text-sm"));
            line.append(make("span", "truncate", label));
            const bar = line.appendChild(make("span", "block h-6 bg-ink px-2 font-mono text-xs font-bold leading-6 text-paper", String(count)));
            bar.style.width = `max(2rem, ${(count / max) * 100}%)`;
            if (tone(label)) bar.style.background = palette[tone(label)];
            else if (count === max) bar.classList.replace("bg-ink", "bg-accent");
          }
        }
        if (v.table) fig.append(table(v.table.columns, v.table.rows));
        if (v.html) {
          const box = fig.appendChild(make("div"));
          box.innerHTML = v.html;
        }
        return fig;
      };

      // A tick named in data.track only marks the row. It adds nothing to the prompt.
      const track = new Set(data.track || []);
      const tickBar = (row) => {
        const ticks = row.ticks || [];
        tickCount.set(row.id, ticks.filter((kind) => !track.has(kind)).length);
        const bar = make("div", "mt-auto flex flex-wrap items-center gap-4 border-t border-rule pt-3");
        for (const kind of ticks) {
          const label = bar.appendChild(make("label", "kicker flex cursor-pointer items-center gap-2"));
          const box = make("input");
          box.type = "checkbox";
          box.dataset.id = row.id;
          if (track.has(kind)) box.dataset.track = kind;
          else box.dataset.tick = kind;
          label.append(box, kind);
        }
        const note = bar.appendChild(make("input", "min-w-[8rem] flex-1 border-b border-rule bg-transparent px-1 py-1 text-sm placeholder:text-muted focus:border-accent focus:outline-none"));
        note.type = "text";
        note.placeholder = "Note";
        note.dataset.note = row.id;
        return bar;
      };

      const card = (run, row, withTicks) => {
        const art = make("article", "flex flex-col gap-3 border-t border-ink pt-4");
        const [first, ...rest] = run.columns;
        const short = (col) => !col.mono && !col.fold && (row.cells[col.key] ?? "").length < 40 && !(row.cells[col.key] ?? "").includes("\n");
        const kickers = [first, ...rest.filter(short)].filter(Boolean).map((col) => row.cells[col.key]).filter(Boolean);
        const top = art.appendChild(make("div", "flex items-baseline gap-3"));
        const tag = top.appendChild(make("span", "tag", row.id));
        top.append(make("span", "kicker text-accent", kickers.join(" · ")));
        const rowTone = tone(row.cells[first.key]);
        if (rowTone) {
          tag.style.background = palette[rowTone];
          art.style.borderTop = `3px solid ${palette[rowTone]}`;
        }
        const byline = rest.filter((col) => col.mono).map((col) => row.cells[col.key]).filter(Boolean);
        if (byline.length) art.append(make("p", "font-mono text-xs text-muted break-all", byline.join(" · ")));
        let headline = false;
        for (const col of rest.filter((c) => !c.mono && !short(c))) {
          const text = row.cells[col.key] ?? "";
          if (!text) continue;
          if (col.fold) {
            const fold = art.appendChild(make("details", "text-sm"));
            fold.append(make("summary", "kicker cursor-pointer text-muted", col.label), make("div", "cell mt-2 border-l-2 border-accent pl-3", text));
            continue;
          }
          if (!headline) {
            headline = true;
            const cut = text.indexOf("\n\n");
            art.append(make("h3", "font-serif text-xl font-bold leading-snug", cut < 0 ? text : text.slice(0, cut)));
            if (cut >= 0) art.append(make("p", "cell text-[15px] text-ink/80", text.slice(cut + 2)));
            for (const v of row.visuals || []) art.append(visual(v));
            continue;
          }
          const para = art.appendChild(make("div", "text-[15px]"));
          para.append(make("p", "kicker mb-1 text-muted", col.label), make("p", "cell", text));
        }
        if (!headline) for (const v of row.visuals || []) art.append(visual(v));
        if (withTicks && (row.ticks || []).length) art.append(tickBar(row));
        return art;
      };

      document.title = data.title;
      const head = document.getElementById("report-head");
      const ears = head.appendChild(make("div", "flex justify-between gap-6 font-mono text-[11px] uppercase tracking-widest text-muted"));
      ears.append(make("span", "truncate text-left", data.path), make("span", "", data.skill || ""));
      head.append(
        make("h1", "my-6 font-serif text-5xl font-bold leading-tight md:text-6xl", data.title),
        make("div", "kicker border-b-[3px] border-t border-double border-b-accent border-t-ink py-2", `${data.runs.length} ${data.runs.length === 1 ? "run" : "runs"} · latest ${data.runs[0]?.date || ""}`),
      );

      const here = decodeURIComponent(location.pathname.split("/").pop());
      const others = (window.REPORTS || []).filter((name) => name !== here);
      if (others.length) {
        const fold = document.getElementById("other-reports");
        fold.hidden = false;
        fold.querySelector("summary").textContent = `Other reports in this folder (${others.length})`;
        const list = fold.querySelector("ul");
        for (const name of others) {
          const link = list.appendChild(make("li", "mb-1")).appendChild(make("a", "underline decoration-rule underline-offset-4 hover:text-accent hover:decoration-accent", name));
          link.href = encodeURIComponent(name);
        }
      }

      const view = document.getElementById("report-runs");
      for (const run of data.runs) {
        const section = view.appendChild(make("section", ""));
        section.append(make("p", "kicker border-t-2 border-accent pt-3 text-accent", `Run ${run.run} · ${run.head || "no commit"} · ${run.date}`));
        section.append(make("h2", "mt-3 font-serif text-4xl font-bold leading-tight", run.title));
        const meta = Object.entries(run.meta || {}).map(([label, value]) => `${label}: ${value}`).join(" · ");
        if (meta) section.append(make("p", "mt-2 font-mono text-xs text-muted break-all", meta));
        section.append(make("p", "my-8 border-l-[3px] border-accent pl-4 font-serif text-xl italic leading-normal", run.answer));
        const visuals = run.visuals || [];
        if (visuals.length) {
          const grid = section.appendChild(make("div", "mb-12 grid grid-cols-1 gap-x-14 gap-y-10 md:grid-cols-2"));
          for (const v of visuals) grid.append(visual(v));
        }
        const rows = run.rows || [];
        if (rows.length) {
          const withTicks = Boolean(data.skill) && rows.some((row) => (row.ticks || []).length);
          const grid = section.appendChild(make("div", "grid grid-cols-1 gap-y-14"));
          for (const row of rows) grid.append(card(run, row, withTicks));
        }
      }

      const promptBox = document.getElementById("prompt");
      const buildPrompt = () => {
        const picked = new Map();
        for (const box of document.querySelectorAll("input[data-tick]:checked")) {
          picked.set(box.dataset.id, [...(picked.get(box.dataset.id) || []), box.dataset.tick]);
        }
        if (!picked.size) {
          promptBox.value = "Tick a row to build the prompt.";
          return;
        }
        const ids = [...picked].map(([id, kinds]) => (tickCount.get(id) > 1 ? `${id}:${kinds.join("+")}` : id));
        const notes = [...picked.keys()]
          .map((id) => [id, document.querySelector(`input[data-note="${id}"]`).value.trim()])
          .filter(([, note]) => note);
        const lines = [`${data.skill} @${data.path} ${ids.join(" ")}`];
        if (notes.length) lines.push("Notes:", ...notes.map(([id, note]) => `- ${id}: ${note}`));
        promptBox.value = lines.join("\n");
      };

      if (data.skill && tickCount.size) {
        document.getElementById("prompt-box").hidden = false;
        document.addEventListener("change", buildPrompt);
        document.addEventListener("input", buildPrompt);
        document.getElementById("copy").onclick = async () => {
          try {
            await navigator.clipboard.writeText(promptBox.value);
          } catch {
            promptBox.select();
            document.execCommand("copy");
          }
          const copied = document.getElementById("copied");
          copied.textContent = "Copied.";
          setTimeout(() => (copied.textContent = ""), 2000);
        };
        buildPrompt();
      }
    </script>
  </body>
</html>
